name: errandly-backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: errandly-api:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  queue:
    image: errandly-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      CACHE_CONFIG: "false"
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: errandly-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      CACHE_CONFIG: "false"
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-errandly}
      POSTGRES_USER: ${DB_USERNAME:-errandly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-errandly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-errandly} -d ${DB_DATABASE:-errandly}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  api_storage:
