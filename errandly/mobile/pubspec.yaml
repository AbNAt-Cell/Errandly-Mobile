name: errandly
description: Errandly - Trusted Hyperlocal Errand Marketplace
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.2.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  smooth_page_indicator: ^1.1.0
  dotted_border: ^2.1.0
  fl_chart: ^0.68.0
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.1
  file_picker: ^8.0.7
  signature: ^5.4.1

  # Real-time
  pusher_channels_flutter: ^2.0.1

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  local_auth: ^2.2.0
  flutter_local_notifications: ^17.2.1
  firebase_messaging: ^15.0.4
  firebase_core: ^3.3.0
  connectivity_plus: ^6.0.5

  # Icons
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
