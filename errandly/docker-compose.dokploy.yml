# errandlyapp — Dokploy Docker Compose (API + queue + scheduler + Redis + Web)
#
# Dokploy: create a Compose service named **errandlyapp**
# Compose path (monorepo git root = parent of this folder):
#   ./errandly/docker-compose.dokploy.yml
# Compose path (this folder is the git root):
#   ./docker-compose.dokploy.yml
#
# Env: paste from .env.dokploy.example into Dokploy → Environment
#      (Dokploy writes a project .env used by this file).
#
# Domains: Dokploy UI → Domains (api → port 80, web → port 3000).
# Network: every service joins external dokploy-network.
#
# Database (pick one):
#   A) Managed Postgres: set DATABASE_URL (internal hostname, not localhost).
#   B) Bundled: enable profile "local-db" and set DB_HOST=postgres.
#
# Do not set container_name — breaks Dokploy logs/metrics.

name: errandlyapp

x-api-env: &api-env
  env_file:
    - path: .env
      required: false
    - path: ./backend/.env
      required: false
  environment:
    # Force compose DNS for Redis; other secrets come from env_file / Dokploy UI
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis

services:
  api:
    <<: *api-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: errandlyapp-api:latest
    restart: unless-stopped
    volumes:
      - api_storage:/var/www/html/storage
    ports:
      - "80"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - dokploy-network
      - default

  queue:
    <<: *api-env
    image: errandlyapp-api:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      CACHE_CONFIG: "false"
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  scheduler:
    <<: *api-env
    image: errandlyapp-api:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      CACHE_CONFIG: "false"
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dokploy-network
      - default

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com/api}
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-mt1}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Errandly}
    image: errandlyapp-web:latest
    restart: unless-stopped
    ports:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  # Optional: enable Compose profile "local-db"
  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-errandly}
      POSTGRES_USER: ${DB_USERNAME:-errandly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-errandly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-errandly} -d ${DB_DATABASE:-errandly}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dokploy-network
      - default

volumes:
  api_storage:
  redis_data:
  postgres_data:

networks:
  dokploy-network:
    external: true
